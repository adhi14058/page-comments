<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<script type="module" src="popup.js"></script>
</head>
<body>
  <div class="top">
    <div class="row"><b><img src="icons/icon-32.png" alt="">page-comments</b><span id="version" class="muted"></span></div>
    <div id="here" class="row" hidden>
      <span class="running"><i class="dot"></i>On this page<kbd id="key" hidden></kbd></span>
      <button id="close" class="soft">Close the tool</button>
    </div>
    <p id="why" class="muted" hidden></p>
    <div id="keep" class="keep" hidden>
      <span>Pins come back after a reload on this site?</span>
      <span class="btns"><button id="later" class="plain">Not now</button><button id="allow" class="primary">Allow</button></span>
    </div>
    <input id="search" type="search" placeholder="Search commented pages" aria-label="Search commented pages">
  </div>
  <div id="list" class="list"></div>
</body>
</html>
