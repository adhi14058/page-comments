    <path d="M410 140 C 520 140, 540 70, 640 70"/>
    <path d="M410 170 L 640 170"/>
    <path d="M410 200 C 520 200, 540 270, 640 270"/>
  </g>
  <g font-size="14" font-weight="700" fill="#52525b" text-anchor="middle">
    <rect x="480" y="78" width="74" height="26" rx="13" fill="#fff" stroke="#e4e4e7"/><text x="517" y="96">Copy</text>
    <rect x="470" y="157" width="94" height="26" rx="13" fill="#fff" stroke="#e4e4e7"/><text x="517" y="175">Share link</text>
    <rect x="466" y="236" width="102" height="26" rx="13" fill="#fff" stroke="#e4e4e7"/><text x="517" y="254">Send (local)</text>
  </g>

  <!-- Destinations -->
  <g filter="url(#sh)">
    <rect x="652" y="34" width="508" height="72" rx="14" fill="#fff"/>
    <rect x="652" y="134" width="508" height="72" rx="14" fill="#fff"/>
    <rect x="652" y="234" width="508" height="72" rx="14" fill="#fff"/>
  </g>
  <g>
    <rect x="670" y="50" width="40" height="40" rx="10" fill="#fff7ed"/>
    <rect x="680" y="58" width="16" height="20" rx="3" fill="none" stroke="#ea580c" stroke-width="2.5"/><rect x="686" y="64" width="16" height="20" rx="3" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="726" y="66" font-size="17" font-weight="700" fill="#18181b">Slack, Jira, Google Docs, email</text>
    <text x="726" y="88" font-size="14" fill="#71717a">Text and numbered pictures, pasted where your team talks</text>
  </g>
  <g>
    <rect x="670" y="150" width="40" height="40" rx="10" fill="#f5f3ff"/>
    <circle cx="684" cy="170" r="6" fill="none" stroke="#7c3aed" stroke-width="2.5"/><circle cx="698" cy="162" r="4.5" fill="#7c3aed"/><circle cx="698" cy="178" r="4.5" fill="#7c3aed"/>
    <path d="M689 167l5-3M689 173l5 3" stroke="#7c3aed" stroke-width="2.5"/>
