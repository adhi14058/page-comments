<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e1b4b" flood-opacity=".12"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker>
  </defs>
  <rect width="1200" height="340" rx="24" fill="#fafafa"/>

  <!-- Your comments -->
  <g filter="url(#sh)"><rect x="40" y="62" width="360" height="216" rx="16" fill="#fff"/></g>
  <text x="64" y="98" font-size="15" font-weight="700" fill="#71717a" letter-spacing=".6">YOUR COMMENTS</text>
  <g font-size="16" fill="#18181b">
    <circle cx="76" cy="132" r="12" fill="#ea580c"/><text x="76" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">1</text>
    <text x="98" y="137">Use the brand colour here</text>
