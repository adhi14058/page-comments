    <path d="M681 263l7 7-7 7" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M692 278h9" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <text x="726" y="266" font-size="17" font-weight="700" fill="#18181b">Claude Code</text>
    <text x="726" y="288" font-size="14" fill="#71717a">Edits your app's source, from your own dev server</text>
