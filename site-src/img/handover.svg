    <text x="98" y="183">Shorter headline</text>
    <circle cx="76" cy="224" r="12" fill="#ea580c"/><text x="76" y="229" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">3</text>
    <text x="98" y="229">Make the price bigger and bold</text>
  </g>
  <g fill="#e4e4e7"><rect x="98" y="146" width="120" height="6" rx="3"/><rect x="98" y="192" width="96" height="6" rx="3"/><rect x="98" y="238" width="140" height="6" rx="3"/></g>

  <!-- Arrows -->
