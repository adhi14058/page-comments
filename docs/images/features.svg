    <text x="24" y="118" font-size="27" font-weight="700" fill="#18181b">Freeze</text>
    <text x="24" y="150" font-size="20" fill="#52525b">Keep a hover menu or tooltip</text>
    <text x="24" y="176" font-size="20" fill="#52525b">still while you comment on it.</text>
