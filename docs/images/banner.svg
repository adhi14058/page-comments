<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/><stop offset=".55" stop-color="#fdf4ff"/><stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#18181b" fill-opacity=".07"/></pattern>
    <filter id="win" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e1b4b" flood-opacity=".18"/></filter>
    <filter id="pop" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18181b" flood-opacity=".2"/></filter>
    <clipPath id="clip"><rect x="660" y="54" width="560" height="314" rx="14"/></clipPath>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#dots)"/>

  <!-- Title side -->
  <g transform="translate(76,92)">
    <g transform="scale(3.2)">
      <path d="M3 3h18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-8l-5 4v-4H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="#ea580c"/>
      <path d="M7.4 5.2L12.16 17.44L13.86 12.51L18.79 10.81Z" fill="#fff"/>
    </g>
    <text x="0" y="146" font-size="60" font-weight="800" fill="#18181b" letter-spacing="-1.8">Page Comments</text>
    <text x="2" y="192" font-size="24" fill="#52525b">Point at anything on a web page.</text>
    <text x="2" y="224" font-size="24" fill="#52525b">Say what should change. Hand it on.</text>
    <g font-size="15" font-weight="600">
      <rect x="0" y="252" width="104" height="32" rx="16" fill="#fff" stroke="#fed7aa"/><text x="52" y="273" text-anchor="middle" fill="#c2410c">Bookmark</text>
      <rect x="114" y="252" width="106" height="32" rx="16" fill="#fff" stroke="#bfdbfe"/><text x="167" y="273" text-anchor="middle" fill="#1d4ed8">Extension</text>
      <rect x="230" y="252" width="118" height="32" rx="16" fill="#fff" stroke="#e4e4e7"/><text x="289" y="273" text-anchor="middle" fill="#3f3f46">No account</text>
      <rect x="358" y="252" width="168" height="32" rx="16" fill="#fff" stroke="#e4e4e7"/><text x="442" y="273" text-anchor="middle" fill="#3f3f46">Stays in your browser</text>
    </g>
  </g>

  <!-- A browser window with the tool at work -->
  <g filter="url(#win)"><rect x="660" y="54" width="560" height="314" rx="14" fill="#fff"/></g>
  <g clip-path="url(#clip)">
    <rect x="660" y="54" width="560" height="38" fill="#f4f4f5"/>
    <circle cx="682" cy="73" r="5.5" fill="#f87171"/><circle cx="700" cy="73" r="5.5" fill="#fbbf24"/><circle cx="718" cy="73" r="5.5" fill="#34d399"/>
    <rect x="742" y="62" width="300" height="22" rx="11" fill="#fff"/>
    <text x="758" y="78" font-size="12.5" fill="#71717a">yourapp.com/pricing</text>

    <!-- Page: heading and three plans -->
    <rect x="852" y="112" width="176" height="14" rx="7" fill="#18181b"/>
    <rect x="882" y="134" width="116" height="8" rx="4" fill="#d4d4d8"/>
    <g>
      <rect x="692" y="164" width="150" height="160" rx="12" fill="#fff" stroke="#e4e4e7"/>
      <rect x="708" y="182" width="60" height="9" rx="4.5" fill="#3f3f46"/><text x="708" y="222" font-size="24" font-weight="800" fill="#18181b">$0</text>
      <rect x="708" y="240" width="96" height="6" rx="3" fill="#e4e4e7"/><rect x="708" y="254" width="80" height="6" rx="3" fill="#e4e4e7"/>
      <rect x="708" y="288" width="118" height="22" rx="7" fill="#fff" stroke="#d4d4d8"/>
    </g>
    <g>
      <rect x="865" y="164" width="150" height="160" rx="12" fill="#fff" stroke="#6366f1" stroke-width="2"/>
      <rect x="881" y="182" width="50" height="9" rx="4.5" fill="#3f3f46"/>
      <text x="881" y="222" font-size="24" font-weight="800" fill="#18181b">$29</text>
      <rect x="877" y="200" width="66" height="30" rx="5" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
      <rect x="881" y="240" width="96" height="6" rx="3" fill="#e4e4e7"/><rect x="881" y="254" width="80" height="6" rx="3" fill="#e4e4e7"/>
      <rect x="881" y="288" width="118" height="22" rx="7" fill="#4f46e5"/>
    </g>
    <g>
      <rect x="1038" y="164" width="150" height="160" rx="12" fill="#fff" stroke="#e4e4e7"/>
      <rect x="1054" y="182" width="56" height="9" rx="4.5" fill="#3f3f46"/><text x="1054" y="222" font-size="24" font-weight="800" fill="#18181b">$79</text>
      <rect x="1054" y="240" width="96" height="6" rx="3" fill="#e4e4e7"/><rect x="1054" y="254" width="80" height="6" rx="3" fill="#e4e4e7"/>
      <rect x="1054" y="288" width="118" height="22" rx="7" fill="#fff" stroke="#d4d4d8"/>
    </g>

    <!-- Numbered pins -->
    <g font-size="12" font-weight="700" text-anchor="middle" fill="#fff">
      <circle cx="1034" cy="114" r="11" fill="#ea580c" stroke="#fff" stroke-width="2"/><text x="1034" y="118">1</text>
      <circle cx="1186" cy="166" r="11" fill="#ea580c" stroke="#fff" stroke-width="2"/><text x="1186" y="170">2</text>
      <circle cx="944" cy="203" r="11" fill="#ea580c" stroke="#fff" stroke-width="2"/><text x="944" y="207">3</text>
    </g>

    <!-- The comment box -->
    <g filter="url(#pop)">
      <rect x="902" y="236" width="244" height="104" rx="12" fill="#fff"/>
    </g>
    <rect x="914" y="248" width="30" height="16" rx="4" fill="#eff6ff"/><text x="929" y="260" font-size="10.5" font-weight="600" text-anchor="middle" fill="#2563eb">div</text>
    <text x="950" y="260" font-size="12" font-weight="600" fill="#18181b">“$29 / month”</text>
    <rect x="914" y="272" width="220" height="30" rx="7" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="924" y="292" font-size="12.5" fill="#18181b">Make the price bigger and bold</text>
    <rect x="1084" y="310" width="50" height="22" rx="7" fill="#ea580c"/><text x="1109" y="325" font-size="11.5" font-weight="700" text-anchor="middle" fill="#fff">Save</text>
    <text x="914" y="325" font-size="10.5" fill="#a1a1aa">Enter saves</text>

    <!-- Pointer over the price -->
    <path d="M934 214 l0 22 l5.5 -5 l4 9 l4 -1.8 l-4 -9 l7.5 -0.5 z" fill="#fff" stroke="#18181b" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <!-- The round button -->
  <g filter="url(#pop)"><circle cx="1182" cy="330" r="24" fill="#2563eb"/></g>
  <g transform="translate(1171,319) scale(0.92)">
    <path d="M3 3h18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-8l-5 4v-4H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="#fff"/>
    <path d="M7.4 5.2L12.16 17.44L13.86 12.51L18.79 10.81Z" fill="#2563eb"/>
  </g>
  <circle cx="1201" cy="311" r="10" fill="#ea580c" stroke="#fff" stroke-width="2"/>
  <text x="1201" y="315" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">3</text>
</svg>
